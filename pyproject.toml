[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-classifier"
version = "0.1.0"
description = "Dataset preparation and training for a bird image classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "pillow>=10",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
